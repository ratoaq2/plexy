[project]
name = "plexy"
version = "0.2.3-dev"
description = "Your Plex, your way"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rato" },
]
requires-python = ">=3.11,<4.0"
keywords = [
    "video",
    "plex",
    "audio",
    "subtitles",
    "preferences",
    "dubbed",
    "subbed",
    "original",
    "language",
    "foreign",
    "movie",
    "episode",
    "tv",
    "track",
    "shows",
    "series",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "plexapi>=4.18.1",
    "click>=8.2.1",
    "babelfish>=0.6.1",
    "trakit>=0.2.3",
    "appdirs>=1.4.4",
    "requests>=2.32",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/ratoaq2/plexy"

[project.scripts]
plexy = "plexy.cli:plexy"

[dependency-groups]
dev = [
    "ruff>=0.13.0",
    "mypy>=1.17.0",
    "types-appdirs>=1.4.3.5",
    "types-pyyaml>=6.0.12.20250516",
    "pytest>=8.4.1",
    "mockito>=1.4.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.33.0.20260906",
]

[tool.pytest.ini_options]
markers = ["live: reads from a real Plex server. Set PLEXY_TEST_CONFIG to run it (see docs/testing.md)."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["plexy"]

[tool.ruff.lint.per-file-ignores]
"plexy/__init__.py" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "babelfish.*",
    "mockito.*",
    "plexapi.*",
    "trakit.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
