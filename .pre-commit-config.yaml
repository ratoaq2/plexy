repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy plexy tests
        language: system
        pass_filenames: false
        types: [python]
      - id: check-knowledge
        name: check knowledge references
        entry: uv run python scripts/check_knowledge.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
